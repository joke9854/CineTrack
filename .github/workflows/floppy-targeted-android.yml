name: Floppy targeted Android validation

on:
  push:
    branches:
      - beta-testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Compile production Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace
      - name: Compile unit tests
        run: ./gradlew :app:compileDebugUnitTestKotlin --stacktrace
      - name: Run Floppy production-neighbor tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.cinetrack.data.sync.floppy.FloppyApiClientTest' \
            --tests 'com.cinetrack.data.sync.floppy.FloppyRemoteDataSourceTest' \
            --tests 'com.cinetrack.data.sync.floppy.FloppyBootstrapRetryTest' \
            --tests 'com.cinetrack.data.sync.floppy.FloppyBootstrapWorkSchedulerTest' \
            --tests 'com.cinetrack.data.sync.floppy.FloppyConnectionPreflightTest' \
            --tests 'com.cinetrack.data.sync.floppy.FloppyRemoteTargetIdentityTest' \
            --tests 'com.cinetrack.data.sync.floppy.FloppyBootstrapV2PlannerTest' \
            --tests 'com.cinetrack.data.sync.floppy.network.FloppyBootstrapBatchingTest' \
            --stacktrace
