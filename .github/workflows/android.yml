name: Android test build

on:
  push:
    branches:
      - "testing/**"
      - "beta-testing"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify beta version format
        run: python3 scripts/check_version_policy.py
      - name: Verify database schema and migration chain
        run: python3 scripts/check_database_indexes.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :baselineprofile:compileNonMinifiedReleaseKotlin
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: CineTrack-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  migration-tests:
    # The release commit may opt out of the emulator-only migration gate once.
    # Normal pushes and pull requests continue to run it.
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip migration]')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Room migration instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: ./gradlew :app:connectedDebugAndroidTest
