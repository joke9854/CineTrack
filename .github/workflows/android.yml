name: Android test build

on:
  push:
    branches:
      - "testing/**"
      - "beta-testing"
  pull_request:

jobs:
  build:
    # An explicit release may opt out of the validation workflow once. Normal
    # pushes and pull requests continue to run the complete Android gate.
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip tests]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify beta version format
        run: python3 scripts/check_version_policy.py
      - name: Verify database schema and migration chain
        run: python3 scripts/check_database_indexes.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Compile and test
        # roborazzi.test.verify makes the screenshot tests fail when a render differs from
        # app/src/test/screenshots. Re-record with :app:recordRoborazziDebug after an intended UI change.
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :baselineprofile:compileNonMinifiedReleaseKotlin -Proborazzi.test.verify=true
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CineTrack-screenshot-diffs
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CineTrack-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  migration-tests:
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[skip migration]') &&
       !contains(github.event.head_commit.message, '[skip tests]'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Enable KVM acceleration
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; refusing to run the Android emulator in slow software-emulation mode."
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
      - name: Run Room migration instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.cinetrack.data.local.AppDatabaseMigrationTest
