name: Android test build

on:
  push:
    branches:
      - "testing/**"
      - "beta-testing"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify database index migration
        run: python3 scripts/check_database_indexes.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :baselineprofile:compileNonMinifiedReleaseKotlin
