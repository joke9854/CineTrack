name: Android test build

on:
  push:
    branches:
      - "testing/**"
      - "beta-testing"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify database index migration
        run: python3 scripts/check_database_indexes.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :baselineprofile:compileNonMinifiedReleaseKotlin
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: CineTrack-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
