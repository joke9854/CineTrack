name: Publish update

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Android test build"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    # Publishing is opt-in. Every push still gets the Android validation
    # workflow, but only an explicit [release] commit (or manual dispatch)
    # reaches the signed build and GitHub Release steps.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (startsWith(github.event.workflow_run.head_branch, 'testing/') || github.event.workflow_run.head_branch == 'beta-testing') &&
        contains(github.event.workflow_run.head_commit.message, '[release]'))) &&
      (github.event_name == 'workflow_dispatch' || !contains(github.event.workflow_run.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Verify beta version policy
        if: github.event_name == 'workflow_run'
        run: |
          PREVIOUS_FILE="$RUNNER_TEMP/cinetrack-previous-build.gradle.kts"
          if git show "HEAD^:app/build.gradle.kts" > "$PREVIOUS_FILE" 2>/dev/null; then
            python3 scripts/check_version_policy.py --previous-file "$PREVIOUS_FILE"
          else
            python3 scripts/check_version_policy.py
          fi
      - name: Verify beta version format
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/check_version_policy.py
      - name: Verify database schema and migration chain
        run: python3 scripts/check_database_indexes.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        run: |
          test -n "$KEYSTORE"
          test -n "$ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$SIMKL_CLIENT_ID"
      - name: Restore release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/cinetrack-release.jks"
      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cinetrack-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify signed APK and profile assets
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$SIGNER" verify "$APK"
          if ! unzip -l "$APK" 'assets/dexopt/*'; then
            echo "No packaged profile; app-specific generation is pending a device run."
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          TARGET_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          TAG="v$VERSION-testing"
          APK="app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "CineTrack-$VERSION-universal.apk"
          sha256sum "CineTrack-$VERSION-universal.apk" > "CineTrack-$VERSION-universal.apk.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$TARGET_SHA" \
              --title "CineTrack $VERSION beta" \
              --notes-file CHANGELOG.md \
              --latest
            gh release upload "$TAG" "CineTrack-$VERSION-universal.apk" "CineTrack-$VERSION-universal.apk.sha256" --clobber
          else
            gh release create "$TAG" "CineTrack-$VERSION-universal.apk" "CineTrack-$VERSION-universal.apk.sha256" \
              --target "$TARGET_SHA" \
              --title "CineTrack $VERSION beta" \
              --notes-file CHANGELOG.md \
              --latest
          fi

